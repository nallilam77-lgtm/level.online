# Duelo de Acero (2 vs 2 por turnos) · servidor del juego en Cloudflare (plan gratis: Workers + Durable Objects con SQLite)
name = "levelup-juego"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# El juego queda en https://juego.levelupstore.online (Cloudflare crea el registro DNS solo al publicar)
routes = [{ pattern = "juego.levelupstore.online", custom_domain = true }]

# La página del juego (para probar en local con `npm run dev` → http://localhost:8787)
[assets]
directory = "../public/juego"

[[durable_objects.bindings]]
name = "SALA"
class_name = "Sala"

# Cola del duelo rápido de la Arena (una sola)
[[durable_objects.bindings]]
name = "COLA"
class_name = "Cola"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Cola"]

# API de la tienda para la Arena (el secreto va aparte: npx wrangler secret put ARENA_SECRETO)
[vars]
ARENA_API = "https://www.levelupstore.online/api/juego"

# Cada minuto: vencimientos, avisos y premios de la Arena (Cron Triggers, incluidos en el plan gratis)
[triggers]
crons = ["* * * * *"]
