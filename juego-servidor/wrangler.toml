# Serpientes Neón · servidor del juego en Cloudflare (plan gratis: Workers + Durable Objects con SQLite)
name = "levelup-juego"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# La página del juego (para probar en local con `npm run dev` → http://localhost:8787)
[assets]
directory = "../public/juego"

[[durable_objects.bindings]]
name = "SALA"
class_name = "Sala"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]
